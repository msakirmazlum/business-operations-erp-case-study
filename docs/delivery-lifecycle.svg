<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end product engineering delivery lifecycle</title>
  <desc id="desc">A six-stage lifecycle from discovery through observation, supported by architecture decisions, quality gates, and feedback loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#17263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d3c3"/>
      <stop offset="1" stop-color="#8bc6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6e8299"/>
    </marker>
    <style>
      .eyebrow{font:700 16px Inter,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#63d6c7}
      .heading{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#f5f7fa}
      .sub{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#aebdcd}
      .num{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#0e1a27}
      .stage{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#f7f9fb}
      .detail{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#aebdcd}
      .label{font:700 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.2px;fill:#90a4b9}
      .evidence{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#dce6ef}
    </style>
  </defs>
  <rect width="1440" height="780" rx="30" fill="url(#bg)"/>
  <circle cx="1280" cy="80" r="210" fill="#2a6c78" opacity=".13"/>
  <circle cx="80" cy="745" r="230" fill="#315d8b" opacity=".12"/>

  <text x="80" y="80" class="eyebrow">PRODUCT ENGINEERING SYSTEM</text>
  <text x="80" y="135" class="heading">From ambiguity to reliable operations</text>
  <text x="80" y="175" class="sub">A controlled delivery loop connecting business intent, software design, production evidence, and learning.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="112" cy="292" r="20" fill="#5ed4c4"/><text x="107" y="298" class="num">1</text>
    <text x="95" y="345" class="stage">Discover</text>
    <text x="95" y="382" class="detail">Map actors, pain</text><text x="95" y="407" class="detail">points, constraints,</text><text x="95" y="432" class="detail">and success signals.</text>

    <rect x="290" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="332" cy="292" r="20" fill="#65cfcb"/><text x="327" y="298" class="num">2</text>
    <text x="315" y="345" class="stage">Model</text>
    <text x="315" y="382" class="detail">Define domains,</text><text x="315" y="407" class="detail">states, permissions,</text><text x="315" y="432" class="detail">and data contracts.</text>

    <rect x="510" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="552" cy="292" r="20" fill="#6bcbd4"/><text x="547" y="298" class="num">3</text>
    <text x="535" y="345" class="stage">Build</text>
    <text x="535" y="382" class="detail">Implement vertical</text><text x="535" y="407" class="detail">slices across UI, API,</text><text x="535" y="432" class="detail">and persistence.</text>

    <rect x="730" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="772" cy="292" r="20" fill="#71c8dc"/><text x="767" y="298" class="num">4</text>
    <text x="755" y="345" class="stage">Verify</text>
    <text x="755" y="382" class="detail">Exercise rules, roles,</text><text x="755" y="407" class="detail">workflows, migration,</text><text x="755" y="432" class="detail">and recovery paths.</text>

    <rect x="950" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="992" cy="292" r="20" fill="#7ac7e9"/><text x="987" y="298" class="num">5</text>
    <text x="975" y="345" class="stage">Release</text>
    <text x="975" y="382" class="detail">Preflight, back up,</text><text x="975" y="407" class="detail">migrate, health-check,</text><text x="975" y="432" class="detail">and validate data.</text>

    <rect x="1170" y="250" width="200" height="220" rx="22" fill="#182a3d" stroke="#2f465d"/>
    <circle cx="1212" cy="292" r="20" fill="#86c5f6"/><text x="1207" y="298" class="num">6</text>
    <text x="1195" y="345" class="stage">Observe</text>
    <text x="1195" y="382" class="detail">Review health, audit,</text><text x="1195" y="407" class="detail">usage, exceptions,</text><text x="1195" y="432" class="detail">and user feedback.</text>
  </g>

  <g stroke="#6e8299" stroke-width="2" opacity=".85" marker-end="url(#arrow)">
    <path d="M270 360H286"/><path d="M490 360H506"/><path d="M710 360H726"/><path d="M930 360H946"/><path d="M1150 360H1166"/>
  </g>

  <path d="M1270 500C1270 570 1160 600 720 600C280 600 170 570 170 500" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#arrow)" opacity=".8"/>
  <rect x="530" y="568" width="380" height="54" rx="27" fill="#0e1a27" stroke="#42657d"/>
  <text x="603" y="602" class="evidence">Operational feedback closes the loop</text>

  <rect x="70" y="670" width="1300" height="70" rx="18" fill="#111f2e" stroke="#2c4359"/>
  <text x="98" y="698" class="label">EVIDENCE AT EVERY STAGE</text>
  <text x="98" y="724" class="evidence">Decision records</text>
  <circle cx="272" cy="718" r="4" fill="#5ed4c4"/>
  <text x="292" y="724" class="evidence">Executable tests</text>
  <circle cx="455" cy="718" r="4" fill="#68ced0"/>
  <text x="475" y="724" class="evidence">Audit trails</text>
  <circle cx="604" cy="718" r="4" fill="#71c9dc"/>
  <text x="624" y="724" class="evidence">Verified backups</text>
  <circle cx="797" cy="718" r="4" fill="#79c7e7"/>
  <text x="817" y="724" class="evidence">Health checks</text>
  <circle cx="961" cy="718" r="4" fill="#82c5f2"/>
  <text x="981" y="724" class="evidence">Conservation checks</text>
</svg>
